name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            spike/browser/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: spike/browser
      - name: Typecheck and test
        run: npm run check
      - name: Lint
        run: npm run lint
        continue-on-error: true
